<!DOCTYPE html>
<html>
  <body style="margin:0;padding:32px 16px;background-color:#f4f7fb;font-family:Arial,sans-serif;color:#101828;">
    <div style="max-width:600px;margin:0 auto;background:#ffffff;border:1px solid #e4e7ec;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(16,24,40,.08);">
      <div style="padding:28px 32px;background:linear-gradient(135deg,#123b6d,#2667b1);color:#ffffff;">
        <div style="font-size:12px;letter-spacing:1.5px;font-weight:bold;opacity:.8;">AISA</div>
        <h1 style="margin:10px 0 0;font-size:26px;line-height:1.25;">Your access is ready</h1>
      </div>
      <div style="padding:32px;">
        <p style="margin:0;font-size:16px;line-height:1.6;color:#344054;">Hello,</p>

        <div style="text-align:center;margin:30px 0 12px;">
          <a href="{{accessLink}}" style="display:inline-block;padding:14px 24px;border-radius:8px;background:#1264a3;color:#ffffff;text-decoration:none;font-size:15px;font-weight:bold;">Click to view</a>

        <p style="margin:20px 0 0;font-size:12px;line-height:1.5;color:#667085;text-align:center;">If the button does not work, copy and paste this link into your browser:<br><a href="{{accessLink}}" style="color:#1264a3;word-break:break-all;">{{accessLink}}</a></p>
      </div>
    </div>
  </body>
</html>
